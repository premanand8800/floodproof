name: tests
on:
  push:
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Python 3.12
        run: uv python install 3.12
      - name: ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Tests (no API keys, no network required)
        run: PYTHONPATH=src uv run --python 3.12 --with pytest pytest -q -p no:cacheprovider
